                    });
                } else if (abnType === 'crushDeformity') {
                    abnormalities.push({
                        type: 'danger',
                        title: `${v.name} Crush Deformity Fracture`,
                        detail: `Post/Ant: ${(v.posteriorHeight / v.anteriorHeight * 100).toFixed(0)}% (< 80%)`
                    });
                }
                if (biconcave) {
                    abnormalities.push({
                        type: 'danger',
                        title: `${v.name} Biconcave Compression`,
                        detail: `Mid/Post: ${(v.middleHeight / v.posteriorHeight * 100).toFixed(0)}% (< 80%)`
                    });
                }
            });

            // 2. Listhesis
            checkListhesis().forEach(l => {
                abnormalities.push({
                    type: 'danger',
                    title: `${l.level} ${l.type}`,
                    detail: `後緣偏移: ${l.shift}%`
                });
            });

            // 3. 終板重疊 (椎間盤狹窄)
            const ordered = getAnatomicalOrder();
            for (let i = 0; i < ordered.length - 1; i++) {
                const metrics = calculateDiscMetrics(ordered[i], ordered[i + 1]);
                if (!metrics || !metrics.overlap) continue;
                abnormalities.push({
                    type: 'warning',
                    title: `${getDiscLevel(ordered[i].name, ordered[i + 1].name)} Disc narrowing`,
                    detail: '上下終板有重疊'
                });
            }

            // 4. 高度遞進
            checkHeightProgression().forEach(h => {
                abnormalities.push({ type: 'warning', title: h.level, detail: h.issue });
            });

            if (abnormalities.length === 0) {
                container.innerHTML = '<div style="color: #27ae60; font-size: 12px; padding: 10px;">✅ 未檢測到明顯異常</div>';
                return;
            }

            container.innerHTML = abnormalities.map(a => `
                <div class="abnormality-card ${a.type}">
                    <strong>⚠️ ${a.title}</strong><br>
                    <span style="font-size: 11px;">${a.detail}</span>
                </div>`).join('');
        }

        // ==================== 匯出 ====================
        function buildExportData() {
            if (vertebrae.length === 0) { alert('請先完成標註'); return null; }

            const ordered = getAnatomicalOrder();

            // 計算椎間盤
            const discData = [];
            for (let i = 0; i < ordered.length - 1; i++) {
                const metrics = calculateDiscMetrics(ordered[i], ordered[i + 1]);
                if (!metrics) continue;

                const level = getDiscLevel(ordered[i].name, ordered[i + 1].name);
                const upperLower = getLowerEndplate(ordered[i]);
                const lowerUpper = getUpperEndplate(ordered[i + 1]);

                discData.push({
                    level,
                    upperEndplate: upperLower,
                    lowerEndplate: lowerUpper,
                    anteriorHeight: metrics.anteriorHeight,
                    posteriorHeight: metrics.posteriorHeight,
                    middleHeight: metrics.middleHeight,
                    wedgeAngle: metrics.wedgeAngle,
                    overlap: metrics.overlap
                });
            }

            const data = {
                version: "2.3",
                exportDate: new Date().toISOString(),
                spineType: spineType,
                endplatePointMode: endplatePointMode,
                caseFlags: getCaseFlags(),
                annotationReview: buildAnnotationReview(),
                imageInfo: originalImage ? {
                    filename: currentImageMeta?.filename || null,
                    width: currentImageMeta?.width || originalImage.naturalWidth || originalImage.width,
                    height: currentImageMeta?.height || originalImage.naturalHeight || originalImage.height,
                    size: currentImageMeta?.size ?? null,
                    lastModified: currentImageMeta?.lastModified ?? null,
                    sha256: currentImageMeta?.sha256 || null,
                    pixelSha256: currentImageMeta?.pixelSha256 || null,
                    pixelHashMethod: currentImageMeta?.pixelSha256 ? PIXEL_HASH_METHOD : null
                } : null,
                vertebrae: ordered.map(v => {
                    const entry = {
                        name: v.name,
                        boundaryType: v.boundaryType || null,
                        hasMiddlePoints: v.hasMiddlePoints
                    };
                    if (v.assist) entry.assist = { ...v.assist };
                    if (v.boundaryType === 'upper') {
                        entry.points = {
                            anteriorSuperior: v.points[0],
                            middleSuperior: v.points[1],
                            posteriorSuperior: v.points[2]
                        };
                    } else if (v.boundaryType === 'lower') {
                        entry.points = {
                            anteriorInferior: v.points[0],
                            middleInferior: v.points[1],
                            posteriorInferior: v.points[2]
                        };
                    } else {
                        entry.points = {
                            anteriorSuperior: v.points[0],
                            middleSuperior: v.points[1],
                            posteriorSuperior: v.points[2],
                            posteriorInferior: v.points[3],
                            middleInferior: v.points[4],
                            anteriorInferior: v.points[5]
                        };
                        entry.anteriorHeight = v.anteriorHeight;
                        entry.middleHeight = v.middleHeight;
                        entry.posteriorHeight = v.posteriorHeight;
                        const fractureType = checkVertebraAbnormal(v);
                        entry.anteriorWedgingFracture = fractureType === 'anteriorWedging';
                        entry.crushDeformityFracture = fractureType === 'crushDeformity';
                        entry.biconcaveCompressionFracture = checkBiconcaveCompression(v);
                    }
                    return entry;
                }),
                discs: discData,
                abnormalities: {
                    compressionFractures: vertebrae
                        .filter(v => !v.boundaryType && checkVertebraAbnormal(v))
                        .map(v => ({
                            name: v.name,
                            type: checkVertebraAbnormal(v) // 'anteriorWedging' or 'crushDeformity'
                        })),
                    biconcaveCompression: vertebrae
                        .filter(v => !v.boundaryType && checkBiconcaveCompression(v))
                        .map(v => ({
                            name: v.name
                        })),
                    listhesis: checkListhesis(),
                    discOverlap: discData
                        .filter(d => d.overlap)
                        .map(d => d.level),
                    heightProgressionIssues: checkHeightProgression()
                }
            };

            return data;
        }

        function exportData() {
            const data = buildExportData();
            if (!data) return;
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const imageStem = String(currentImageMeta?.filename || '').split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
            a.download = imageStem ? `${imageStem}.json` : `spine_annotation_${spineType}_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            annotationDirty = false;
            notifyViewerOfExport(data, a.download);
        }

        function exportReport() {
            if (vertebrae.length === 0) { alert('請先完成標註'); return; }

            const ordered = getAnatomicalOrder();
            let report = `脊椎標註報告\n${'='.repeat(40)}\n\n`;
            report += `脊椎類型: ${spineType === 'L' ? '腰椎' : '頸椎'}\n`;
            report += `標註日期: ${new Date().toLocaleString('zh-TW')}\n\n`;

            report += `椎體分析\n${'-'.repeat(30)}\n`;
            ordered.forEach(v => {
                if (v.boundaryType) {
                    report += `${v.name}: 邊界椎體 (${v.boundaryType === 'upper' ? '上終板' : '下終板'})\n`;
                } else {
                    const abnormal = checkVertebraAbnormal(v);
                    const biconcave = checkBiconcaveCompression(v);
                    report += `${v.name}: 前緣 ${v.anteriorHeight?.toFixed(1)}px / 中間 ${v.middleHeight?.toFixed(1)}px / 後緣 ${v.posteriorHeight?.toFixed(1)}px`;
                    report += ` (前/後 ${(v.anteriorHeight / v.posteriorHeight * 100).toFixed(0)}%)`;
                    if (abnormal === 'anteriorWedging') report += ` ⚠️ Anterior Wedging Fracture`;
                    if (abnormal === 'crushDeformity') report += ` ⚠️ Crush Deformity Fracture`;
                    if (biconcave) report += ` ⚠️ Biconcave Compression`;
                    report += `\n`;
                }
            });

            report += `\n椎間盤分析\n${'-'.repeat(30)}\n`;
            for (let i = 0; i < ordered.length - 1; i++) {
                const metrics = calculateDiscMetrics(ordered[i], ordered[i + 1]);
                if (!metrics) continue;
                const level = getDiscLevel(ordered[i].name, ordered[i + 1].name);
                report += `${level}: 高度 ${metrics.middleHeight.toFixed(1)}px, Wedge ${metrics.wedgeAngle.toFixed(1)}°`;
                if (metrics.overlap) report += ` ⚠️ 終板重疊`;
                report += `\n`;
            }

            const listhesis = checkListhesis();
            if (listhesis.length > 0) {
                report += `\n滑脫檢測\n${'-'.repeat(30)}\n`;
                listhesis.forEach(l => {
                    report += `${l.level}: ${l.type} (${l.shift}%)\n`;
                });
            }

            navigator.clipboard.writeText(report).then(() => {
                alert('報告已複製到剪貼簿');
            });
        }
    </script>
</body>
