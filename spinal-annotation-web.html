                const v = vertebrae[i];
                const cx = v.points.reduce((s, p) => s + p.x, 0) / v.points.length;
                const cy = v.points.reduce((s, p) => s + p.y, 0) / v.points.length;
                if (cx >= x1 && cx <= x2 && cy >= y1 && cy <= y2) {
                    selectedVertebrae.add(i);
                }
            }
        }

        // 切換單個椎體的選取狀態（從 sidebar 呼叫）
        function toggleSelectVertebra(idx) {
            if (selectedVertebrae.has(idx)) {
                selectedVertebrae.delete(idx);
            } else {
                selectedVertebrae.add(idx);
            }
            redraw();
            updateUI();
        }

        function deleteSelectedVertebrae() {
            if (medsamBlocked()) return;
            if (selectedVertebrae.size === 0) return;
            const names = [...selectedVertebrae].map(i => vertebrae[i].name).join(', ');
            if (!confirm(`刪除 ${selectedVertebrae.size} 個椎體？\n${names}`)) return;

            const sorted = [...selectedVertebrae].sort((a, b) => b - a);
            for (const idx of sorted) {
                vertebrae.splice(idx, 1);
            }
            selectedVertebrae.clear();
            annotationFinished = false;
            markAnnotationDirty();
            redraw();
            updateUI();
        }

        function zoomIn() { zoom = Math.min(5, zoom * 1.2); document.getElementById('zoomLevel').textContent = Math.round(zoom * 100); redraw(); }
        function zoomOut() { zoom = Math.max(0.1, zoom / 1.2); document.getElementById('zoomLevel').textContent = Math.round(zoom * 100); redraw(); }
        function resetZoom() { zoom = 1; panX = 0; panY = 0; document.getElementById('zoomLevel').textContent = '100'; redraw(); }

        // ==================== 脊椎類型 ====================
        function setSpineType(type) {
            if (vertebrae.length > 0 || currentPoints.length > 0) {
                if (!confirm('切換脊椎類型會清除現有標註，確定嗎？')) return;
                resetCaseState({ keepImage: true });
                markAnnotationDirty();
            }
            spineType = type;
            document.querySelectorAll('.spine-type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            updateUI();
            redraw();
        }

        function setEndplatePointMode(mode) {
            if (endplatePointMode === mode) return;
            if (vertebrae.length > 0 || currentPoints.length > 0) {
                if (!confirm('切換終板點數會清除現有標註，確定嗎？')) {
                    updateEndplateModeUI();
                    return;
                }
                resetCaseState({ keepImage: true });
                markAnnotationDirty();
            }
            endplatePointMode = mode;
            updateEndplateModeUI();
            updateUI();
            redraw();
        }

        function updateEndplateModeUI() {
            document.querySelectorAll('input[name="endplateMode"]').forEach(input => {
                input.checked = parseInt(input.value, 10) === endplatePointMode;
            });
        }

        // ==================== 點擊處理 ====================
        function handleCanvasClick(event) {
            if (!originalImage || isDragging || _justDragged) { _justDragged = false; return; }

            // MedSAM 模式下用拉框產生點位，單擊不新增點
            if (medsamMode) return;

            // Shift 鍵保留給框選，不新增點
            if (event.shiftKey) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const canvasX = (event.clientX - rect.left) * scaleX;
            const canvasY = (event.clientY - rect.top) * scaleY;
            const x = (canvasX - panX) / zoom;
            const y = (canvasY - panY) / zoom;

            if (x < 0 || x > originalImage.width || y < 0 || y > originalImage.height) return;

            // 如果點擊的是已有角點（拖曳起始），不新增點
            const hitRadius = 12 / zoom;
            if (_findNearestPoint(x, y, hitRadius)) return;

            const nextName = getNextVertebraName();
            if (!nextName) {
                // 已完成標註: 不顯示提示，安靜忽略
                return;
            }

            const requiredPts = getRequiredPoints(nextName);
            currentPoints.push({x, y});
            markAnnotationDirty();

            if (currentPoints.length === requiredPts) {
                const boundaryType = isBoundary(nextName);
                let sortedPoints;
                const hasMiddlePoints = endplatePointMode === 3;

                if (boundaryType === 'upper') {
                    // S1/T1: 只有上終板
                    sortedPoints = normalizeEndplate(currentPoints);
                } else if (boundaryType === 'lower') {
                    // T12/C2: 只有下終板
                    sortedPoints = normalizeEndplate(currentPoints);
                } else {
                    // 完整椎體: 4/6 點
                    sortedPoints = normalizePoints(currentPoints);
                }

                vertebrae.push({
                    name: nextName,
                    points: sortedPoints,
                    boundaryType: boundaryType,
                    anteriorHeight: null,
                    posteriorHeight: null,
                    hasMiddlePoints: hasMiddlePoints
                });

                calculateVertebraMetrics(vertebrae.length - 1);
                currentPoints = [];
            }

            redraw();
            updateUI();
        }

        function midpoint(p1, p2) {
            return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
        }

        function normalizeEndplate(points) {
            // 2 或 3 點: x 排序 → [anterior(最小x), middle(中間x), posterior(最大x)]
            const sorted = [...points].sort((a, b) => a.x - b.x);
            if (sorted.length === 2) {
                const mid = midpoint(sorted[0], sorted[1]);
                return [sorted[0], mid, sorted[1]];
            }
            return [sorted[0], sorted[1], sorted[2]];
        }

        function normalizePoints(points) {
            // 4 或 6 點: 產出 [前上, 上中, 後上, 後下, 下中, 前下]
            const sorted = [...points].sort((a, b) => a.y - b.y);
            const half = sorted.length / 2;
            const topPoints = sorted.slice(0, half);
            const bottomPoints = sorted.slice(half);

            topPoints.sort((a, b) => a.x - b.x);
            bottomPoints.sort((a, b) => a.x - b.x);

            if (points.length === 4) {
                const anteriorSuperior = topPoints[0];
                const posteriorSuperior = topPoints[1];
                const anteriorInferior = bottomPoints[0];
                const posteriorInferior = bottomPoints[1];
                const middleSuperior = midpoint(anteriorSuperior, posteriorSuperior);
                const middleInferior = midpoint(anteriorInferior, posteriorInferior);
                return [
                    anteriorSuperior,
                    middleSuperior,
                    posteriorSuperior,
                    posteriorInferior,
                    middleInferior,
                    anteriorInferior
                ];
            }

            return [
                topPoints[0],     // 0: 前上角 (anterior-superior)
                topPoints[1],     // 1: 上終板中點 (middle-superior)
                topPoints[2],     // 2: 後上角 (posterior-superior)
                bottomPoints[2],  // 3: 後下角 (posterior-inferior)
                bottomPoints[1],  // 4: 下終板中點 (middle-inferior)
                bottomPoints[0]   // 5: 前下角 (anterior-inferior)
            ];
        }

        function calculateVertebraMetrics(index) {
            const v = vertebrae[index];
            if (v.boundaryType) {
                // 邊界椎體只有一條終板，無法計算前後緣高度
                v.anteriorHeight = null;
                v.posteriorHeight = null;
                v.middleHeight = null;
                return;
            }
            const pts = v.points;
            // pts: [0:AS, 1:MS, 2:PS, 3:PI, 4:MI, 5:AI]
            v.anteriorHeight = Math.sqrt(
                Math.pow(pts[5].x - pts[0].x, 2) + Math.pow(pts[5].y - pts[0].y, 2)
            );
            v.posteriorHeight = Math.sqrt(
                Math.pow(pts[3].x - pts[2].x, 2) + Math.pow(pts[3].y - pts[2].y, 2)
            );
            v.middleHeight = Math.sqrt(
                Math.pow(pts[4].x - pts[1].x, 2) + Math.pow(pts[4].y - pts[1].y, 2)
            );
        }

        // ==================== 取得終板座標（統一介面）====================
        function getUpperEndplate(v) {
            // 取得椎體上終板的 [anterior, middle, posterior] 座標
            if (v.boundaryType === 'upper') {
                // S1/T1: 只有上終板 [前上, 上中, 後上]
                return [v.points[0], v.points[1], v.points[2]];
            } else if (v.boundaryType === 'lower') {
                // T12/C2: 沒有上終板
                return null;
            }
            // 完整椎體: [前上, 上中, 後上]
            return [v.points[0], v.points[1], v.points[2]];
        }

        function getLowerEndplate(v) {
            // 取得椎體下終板的 [anterior, middle, posterior] 座標
            if (v.boundaryType === 'lower') {
                // T12/C2: 只有下終板 [前下, 下中, 後下]
                return [v.points[0], v.points[1], v.points[2]];
            } else if (v.boundaryType === 'upper') {
                // S1/T1: 沒有下終板
                return null;
            }
            // 完整椎體: [前下, 下中, 後下]
            return [v.points[5], v.points[4], v.points[3]];
        }

        function getPosteriorPoints(v) {
            // 取得後緣的 [上, 下] 座標，用於滑脫檢測
            if (v.boundaryType === 'upper') {
                // S1/T1: 只有上終板，後緣上點 = posterior-superior
                return { top: v.points[2], bottom: null };
            } else if (v.boundaryType === 'lower') {
                // T12/C2: 只有下終板，後緣下點 = posterior-inferior
                return { top: null, bottom: v.points[2] };
            }
            // pts: [0:AS, 1:MS, 2:PS, 3:PI, 4:MI, 5:AI]
            return { top: v.points[2], bottom: v.points[3] };
        }

        // ==================== 快捷鍵 ====================
        function handleKeyDown(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveToOriginal();
                return;
            }
            if (e.ctrlKey && e.key === 'z') {
                e.preventDefault();
                undoPoint();
            }
            const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement && document.activeElement.tagName) || '');
            if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey && !typing) {
                e.preventDefault();
                toggleMedsamMode();
                return;
            }
            if (e.key === 'Escape' && medsamBox) {
                medsamBox = null;
                redraw();
                return;
            }
            if ((e.key === 'Delete' || e.key === 'Backspace') && selectedVertebrae.size > 0) {
                e.preventDefault();
                deleteSelectedVertebrae();
            }
            // Escape 取消框選
            if (e.key === 'Escape' && (selectBox || selectedVertebrae.size > 0)) {
                selectBox = null;
                selectedVertebrae.clear();
                redraw();
                updateUI();
            }
        }

        function undoPoint() {
            if (medsamBlocked()) return;
            if (currentPoints.length > 0) {
                currentPoints.pop();
                markAnnotationDirty();
            } else if (vertebrae.length > 0) {
                vertebrae.pop();
                annotationFinished = false; // 撤銷後可繼續標註
                finishedEarly = false;
                syncCaseFlagsUI();
                markAnnotationDirty();
            }
            redraw();
            updateUI();
        }

        function deleteCurrentVertebra() {
            if (medsamBlocked()) return;
            if (currentPoints.length > 0) {
                currentPoints = [];
                markAnnotationDirty();
            } else if (vertebrae.length > 0) {
                vertebrae.pop();
                annotationFinished = false; // 刪除椎體後可繼續標註
                finishedEarly = false;
                syncCaseFlagsUI();
                markAnnotationDirty();
            }
            redraw();
            updateUI();
        }

        function clearAll() {
            if (medsamBlocked()) return;
            if (confirm('確定清除所有標註？')) {
                resetCaseState({ keepImage: true });
                markAnnotationDirty();
                redraw();
                updateUI();
            }
        }

        function finishEarly() {
            if (vertebrae.length < 2) {
                alert('至少需要標註 2 個椎體才能結束');
                return;
            }
            if (currentPoints.length > 0) {
                if (!confirm('目前有未完成的標註點，確定要捨棄並結束嗎？')) return;
                currentPoints = [];
            }
            annotationFinished = true;
            finishedEarly = true;
            if (!truncatedReason) truncatedReason = 'obscured';
            syncCaseFlagsUI();
            markAnnotationDirty();
            redraw();
            updateUI();
        }

        // ==================== 病例旗標 ====================
        function setCaseImplant(checked) {
            caseHasImplant = Boolean(checked);
            markAnnotationDirty();
            syncCaseFlagsUI();
        }

        function setImplantNote(text) {
            caseImplantNote = String(text || '').trim();
            markAnnotationDirty();
        }

        function setTruncatedReason(value) {
            truncatedReason = value || null;
            markAnnotationDirty();
        }

        // 該 spineType 的全部椎體都已標完 → 不論有沒有按過「結束標註」，都視為完整。
        // （09-22 有 7 份 36 點完整標註仍帶 annotationComplete=false，就是旗標黏住了。）
        function allExpectedVertebraeAnnotated() {
            const expected = (CONFIG[spineType] && CONFIG[spineType].vertebrae) || [];
            if (!expected.length) return false;
            const names = new Set(vertebrae.map(v => v.name));
            return expected.every(name => names.has(name));
        }

        function getCaseFlags() {
            const truncated = finishedEarly && !allExpectedVertebraeAnnotated();
            return {
                hasImplant: caseHasImplant,
                implantNote: caseHasImplant ? caseImplantNote : '',
                annotationComplete: !truncated,
                truncatedReason: truncated ? (truncatedReason || 'obscured') : null
            };
        }

        function applyCaseFlags(flags) {
            const f = flags && typeof flags === 'object' ? flags : {};
            caseHasImplant = Boolean(f.hasImplant);
            caseImplantNote = String(f.implantNote || '');
            finishedEarly = f.annotationComplete === false;
            truncatedReason = finishedEarly ? (f.truncatedReason || 'obscured') : null;
            syncCaseFlagsUI();
        }

        function syncCaseFlagsUI() {
            const chk = document.getElementById('implantCheck');
            if (chk) chk.checked = caseHasImplant;
            const note = document.getElementById('implantNote');
            if (note) {
                note.value = caseImplantNote;
                note.style.display = caseHasImplant ? '' : 'none';
            }
            const trunc = document.getElementById('truncatedBox');
            if (trunc) trunc.style.display = finishedEarly ? '' : 'none';
            const sel = document.getElementById('truncatedReason');
            if (sel) sel.value = truncatedReason || 'obscured';
        }

        // ==================== 匯入 JSON ====================
        function handleJsonImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            event.target.value = ''; // 允許重複選取同一檔案

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (importAnnotationJson(data, { jsonFilename: file.name })) {
                        currentJsonSource = { name: file.name, relPath: null };
                        updateSaveUI();
                    }
                } catch(err) {
                    alert('JSON 解析失敗: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function filenameStem(filename, isJson = false) {
            const leaf = String(filename || '').split(/[\\/]/).pop();
            let stem = leaf.replace(/\.[^.]+$/, '');
            if (isJson) stem = stem.replace(/\.spinefm$/i, '');
            return stem.toLowerCase();
        }

        function validateAnnotationForCurrentImage(data, jsonFilename = null) {
            const errors = [];
            const warnings = [];

            if (!originalImage) {
                errors.push('請先載入要標註的影像。');
                return { ok: false, errors, warnings };
            }

            const info = data && data.imageInfo;
            if (!info || !Number.isFinite(Number(info.width)) || !Number.isFinite(Number(info.height))) {
                errors.push('JSON 缺少可驗證的 imageInfo.width / height。');
                return { ok: false, errors, warnings };
            }

            const imageWidth = currentImageMeta?.width || originalImage.naturalWidth || originalImage.width;
            const imageHeight = currentImageMeta?.height || originalImage.naturalHeight || originalImage.height;
            if (Number(info.width) !== Number(imageWidth) || Number(info.height) !== Number(imageHeight)) {
                errors.push(`影像尺寸不符：JSON ${info.width}×${info.height}，目前影像 ${imageWidth}×${imageHeight}。`);
            }

            if (errors.length) return { ok: false, errors, warnings };

            // 配對順序：像素雜湊 → 檔案 SHA-256 → 檔名。
            // 影像常是「剪貼簿貼上（image.png）→ 標註 → 另存成病歷號.png」，另存會重新編碼，
            // 檔案 SHA-256 與 JSON 記錄的檔名都會變，但像素不變，JSON 與影像的主檔名也相同。
            const lower = value => (value ? String(value).toLowerCase() : null);
            const notes = [];
            const currentFilename = currentImageMeta?.filename || null;
            const recordedFilename = info.filename || info.fileName || null;
            const jsonHash = lower(info.sha256 || info.sha256Hash);
            const imageHash = lower(currentImageMeta?.sha256);
            const jsonPixel = lower(info.pixelSha256);
            const imagePixel = lower(currentImageMeta?.pixelSha256);
            const done = (extra = {}) => ({ ok: errors.length === 0, errors, warnings, notes, ...extra });

            if (jsonPixel && imagePixel && jsonPixel === imagePixel) {
                if (jsonHash && imageHash && jsonHash !== imageHash) notes.push('檔案 SHA-256 不同（影像另存過），像素相同。');
                return done();
            }
            if (jsonHash && imageHash && jsonHash === imageHash) return done();

            const pixelDiffers = !!(jsonPixel && imagePixel);
            const fileDiffers = !!(jsonHash && imageHash);
            const jsonStem = filenameStem(jsonFilename, true);
            const imageStem = filenameStem(currentFilename);
            const imageNamed = !isGenericImageName(currentFilename);
            const recordedNamed = !!recordedFilename && !isGenericImageName(recordedFilename);
            // 兩條檔名線索：JSON 主檔名 vs 影像主檔名、JSON 記錄的檔名 vs 影像檔名。通用檔名（image.png）不算線索。
            const jsonNamed = !!jsonStem && !isGenericImageName(jsonStem);   // 貼上後匯出的 JSON 預設叫 image.json
            const stemMatch = jsonNamed && imageNamed && jsonStem === imageStem;
            const stemConflict = jsonNamed && imageNamed && jsonStem !== imageStem;
            const nameMatch = recordedNamed && lower(recordedFilename) === lower(currentFilename);
            const nameConflict = recordedNamed && imageNamed && !nameMatch;
            const paired = (stemMatch && !nameConflict) || (nameMatch && !stemConflict);
            const contradictory = (stemMatch && nameConflict) || (nameMatch && stemConflict);

            if (pixelDiffers) {
                if (paired) return done({ confirm: '檔名對應、尺寸相同，但像素內容和 JSON 記錄的不同（可能是不同的影像處理版本）。\n確定要載入這份標註？' });
                errors.push('影像像素內容不同，JSON 對應的不是這張影像。');
                return done();
            }
            if (paired) {
                if (fileDiffers) notes.push('檔案 SHA-256 不同（影像可能另存或重新編碼過），已依檔名與尺寸配對。');
                else if (!recordedFilename && !jsonHash) warnings.push('舊版 JSON 沒有影像檔名或 SHA-256，已用同主檔名與相同尺寸驗證。');
                else if (jsonHash && !imageHash) warnings.push('目前環境無法取得影像 SHA-256，僅以檔名與尺寸驗證。');
                if (jsonPixel && !imagePixel) warnings.push('目前環境無法計算影像像素雜湊，僅以檔名與尺寸配對。');
                return done();
            }
            if (contradictory) {
                return done({ confirm: `檔名線索互相矛盾：JSON 是 ${jsonFilename || '（無檔名）'}、記錄的影像是 ${recordedFilename}，目前影像是 ${currentFilename}；檔案雜湊也不同。\n確定要載入這份標註？` });
            }
            if (nameConflict) {
                errors.push(`影像檔名不符：JSON 指向 ${recordedFilename}，目前影像為 ${currentFilename}，檔案 SHA-256 也不同。`);
            } else if (stemConflict) {
                errors.push(`主檔名不符：JSON 是 ${jsonFilename}，目前影像為 ${currentFilename}，檔案 SHA-256 也不同。`);
            } else if (!recordedFilename && !jsonHash && !jsonPixel) {
                errors.push('舊版 JSON 沒有影像檔名；JSON 與影像必須使用完全相同的主檔名。');
            } else {
                // 例如貼上的影像（image.png）配舊 JSON：只剩尺寸可比，交給使用者決定
                return done({ confirm: '無法確認 JSON 與目前影像是同一張：只有尺寸相同（貼上的影像沒有檔名，檔案 SHA-256 不同或沒有記錄）。\n確定要載入這份標註？' });
            }
            return done();
        }

        // 剪貼簿貼上的影像沒有真正的檔名（Chrome 給 image.png），不能拿來配對
        function isGenericImageName(filename) {
            const stem = filenameStem(filename);
            return !stem || /^(image|blob|clipboard|untitled|pasted|pasted graphic|screenshot|screen shot|download|downloads|圖片|未命名|擷取|螢幕擷取畫面|剪取)([\s_-]*\(?\d+\)?)?$/i.test(stem);
        }

        function importAnnotationJson(data, options = {}) {
            // 支援多種格式:
            // 1. V2.3 標註格式 (spinal-annotation-web 匯出)
            // 2. AI 推理結果格式 (spine-inference-web 匯出)
            // 3. 原始推理 API 回傳格式

            const srcVertebrae = data.vertebrae;
            if (!srcVertebrae || srcVertebrae.length === 0) {
                alert('JSON 中沒有找到椎體資料');
                return false;
            }

            if (!data.originalImageBase64 && !options.skipIdentityValidation) {
                const validation = validateAnnotationForCurrentImage(data, options.jsonFilename || null);
                if (!validation.ok) {
                    alert('拒絕載入標註：\n' + validation.errors.join('\n'));
                    return false;
                }
                if (validation.confirm && !confirm(validation.confirm)) return false;
                if (validation.notes && validation.notes.length) console.info('標註配對：' + validation.notes.join(' '));
                if (validation.warnings.length > 0 && !options.silent) {
                    alert(validation.warnings.join('\n'));
                }
            }

            if (annotationDirty && !options.replaceConfirmed && !confirmDiscardUnsavedChanges()) {
                return false;
            }

            // 設定脊椎類型
            const st = data.spineType || data.spine_type || 'L';
            spineType = st;
            document.querySelectorAll('.spine-type-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.type === st);
            });

            // 如果 JSON 帶有原圖 base64，自動載入
            if (data.originalImageBase64) {
                const img = new Image();
                const requestToken = ++imageLoadToken;
                img.onload = async function() {
                    const pixelSha256 = await calculatePixelSha256(null, img);
                    if (requestToken !== imageLoadToken) return;
                    resetCaseState();
                    originalImage = img;
                    canvas.width = Math.min(img.width, 1200);
                    canvas.height = Math.round(canvas.width * (img.height / img.width));
                    zoom = canvas.width / img.width;
                    panX = 0; panY = 0;
                    currentImageMeta = {
                        filename: data.imageInfo?.filename || null,
                        width: img.naturalWidth || img.width,
                        height: img.naturalHeight || img.height,
                        size: null,
                        lastModified: null,
                        sha256: null,          // 沒有原始檔位元組，不照抄 JSON 宣稱的值
                        pixelSha256
                    };
                    _finishImport(srcVertebrae, data, options);
                };
                img.src = data.originalImageBase64;
                return true;
            }

            _finishImport(srcVertebrae, data, options);
            return true;
        }

        function _finishImport(srcVertebrae, data, options = {}) {
            // 清除現有標註
            resetCaseState({ keepImage: true });

            const config = CONFIG[spineType];

            // 轉換每個椎體到內部格式
            for (const sv of srcVertebrae) {
                const name = sv.name;
                const bt = sv.boundaryType || null;
                const pts = sv.points;
                if (!pts) continue;

                let internalPoints;

                if (bt === 'upper') {
                    // 上邊界: 需要 3 點 [AS, MS, PS]
                    const as = pts.anteriorSuperior;
                    const ps = pts.posteriorSuperior;
                    if (!as || !ps) continue;
                    const ms = pts.middleSuperior || midpoint(as, ps);
                    internalPoints = [
                        {x: as.x, y: as.y},
                        {x: ms.x, y: ms.y},
                        {x: ps.x, y: ps.y}
                    ];
                } else if (bt === 'lower') {
                    // 下邊界: 需要 3 點 [AI, MI, PI]
                    const ai = pts.anteriorInferior;
                    const pi = pts.posteriorInferior;
                    if (!ai || !pi) continue;
                    const mi = pts.middleInferior || midpoint(ai, pi);
                    internalPoints = [
                        {x: ai.x, y: ai.y},
                        {x: mi.x, y: mi.y},
                        {x: pi.x, y: pi.y}
                    ];
                } else {
                    // 完整椎體: 需要 6 點 [AS, MS, PS, PI, MI, AI]
                    const as = pts.anteriorSuperior;
                    const ps = pts.posteriorSuperior;
                    const pi = pts.posteriorInferior;
                    const ai = pts.anteriorInferior;
                    if (!as || !ps || !pi || !ai) continue;
                    // 自動計算 middle 點 (AI 推理結果沒有 middle 點)
                    const ms = pts.middleSuperior || midpoint(as, ps);
                    const mi = pts.middleInferior || midpoint(ai, pi);
                    internalPoints = [
                        {x: as.x, y: as.y},
                        {x: ms.x, y: ms.y},
                        {x: ps.x, y: ps.y},
                        {x: pi.x, y: pi.y},
                        {x: mi.x, y: mi.y},
                        {x: ai.x, y: ai.y}
                    ];
                }

                const v = {
                    name: name,
                    points: internalPoints,
                    boundaryType: bt,
                    hasMiddlePoints: true,
                    anteriorHeight: null,
                    posteriorHeight: null,
                    middleHeight: null
                };
                if (sv.assist && typeof sv.assist === 'object') v.assist = { ...sv.assist };
                vertebrae.push(v);
            }

            // 計算所有椎體的指標
            for (let i = 0; i < vertebrae.length; i++) {
                calculateVertebraMetrics(i);
            }

            // 標記為已完成 (匯入的標註可直接編輯)
            annotationFinished = true;
            endplatePointMode = 3; // 匯入後以 3 點模式顯示
            applyCaseFlags(data && data.caseFlags); // 舊 JSON 沒有 caseFlags → 全部預設值
            importedAnnotationReview = (data && typeof data.annotationReview === 'object') ? data.annotationReview : null;
            markAnnotationDirty();

            redraw();
            updateUI();

            const src = data.source === 'ai-inference' ? ' (AI 推理結果)'
                       : data.source === 'spinefm' ? '' // SpineFM 有自己的 alert
                       : (data.backend === 'SpineFM' ? '' : '');
            if (data.source !== 'spinefm' && !options.silent) {
                alert(`成功匯入 ${vertebrae.length} 個椎體${src}\n\n可拖曳角點進行修正，完成後匯出 JSON`);
            }
        }

        // ==================== 載入 SpineFM 結果 ====================
        function loadSpineFM() {
            document.getElementById('spinefmInput').click();
        }

        function handleSpineFMSelect(event) {
            const files = Array.from(event.target.files);
            event.target.value = '';

            if (files.length === 0) return;

            // 分類檔案
            let jsonFile = null;
            let imageFile = null;

            for (const f of files) {
                if (f.name.endsWith('.json')) {
                    jsonFile = f;
                } else if (/\.(png|jpg|jpeg|bmp|tif|tiff)$/i.test(f.name)) {
                    imageFile = f;
                }
            }

            // 只選了 JSON → 載入 JSON，提示使用者之後載入影像
            if (jsonFile && !imageFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.vertebrae || data.vertebrae.length === 0) {
                            alert('SpineFM JSON 中沒有椎體資料。\n請確認 SpineFM 推論已成功執行。');
                            return;
                        }
                        // 儲存 JSON 資料，等影像載入後匯入
                        window._pendingSpineFM = data;
                        window._spinefmJsonName = jsonFile.name;

                        // 推測影像檔名: xxx.spinefm.json → xxx.png
                        const baseName = jsonFile.name.replace(/\.spinefm\.json$/i, '').replace(/\.json$/i, '');
                        alert(
                            `已讀取 SpineFM 結果: ${data.vertebrae.length} 個椎體\n` +
                            `(${jsonFile.name})\n\n` +
                            `請再選取對應的原始影像 (${baseName}.png)\n` +
                            `或先用「載入影像」載入影像後，再按「載入 SpineFM」選取 JSON。`
                        );

                        // 如果已有影像，直接匯入
                        if (originalImage) {
                            _applySpineFMData(data);
                        }
                    } catch(err) {
                        alert('JSON 解析失敗: ' + err.message);
                    }
                };
                reader.readAsText(jsonFile);
                return;
            }

            // 只選了影像 → 載入影像，然後套用暫存的 SpineFM
            if (imageFile && !jsonFile) {
                const pendingData = window._pendingSpineFM;
                const pendingName = window._spinefmJsonName;
                _loadImageFile(imageFile, function() {
                    if (pendingData) {
                        window._pendingSpineFM = pendingData;
                        window._spinefmJsonName = pendingName;
                        _applySpineFMData(pendingData);
                    }
                });
                return;
            }

            // 同時選了影像 + JSON → 先載入影像，再匯入 JSON
            if (imageFile && jsonFile) {
                const jsonReader = new FileReader();
                jsonReader.onload = function(je) {
                    try {
                        const data = JSON.parse(je.target.result);
                        if (!data.vertebrae || data.vertebrae.length === 0) {
                            alert('SpineFM JSON 中沒有椎體資料。');
                            return;
                        }
                        _loadImageFile(imageFile, function() {
                            window._spinefmJsonName = jsonFile.name;
                            _applySpineFMData(data);
                        });
                    } catch(err) {
                        alert('JSON 解析失敗: ' + err.message);
                    }
                };
                jsonReader.readAsText(jsonFile);
                return;
            }
        }

        function _loadImageFile(file, callback) {
            if (!confirmDiscardUnsavedChanges()) return;
            const requestToken = ++imageLoadToken;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = async function() {
                    const [sha256, pixelSha256] = await Promise.all([calculateFileSha256(file), calculatePixelSha256(file, img)]);
                    if (requestToken !== imageLoadToken) return;
                    commitLoadedImage(img, file, sha256, pixelSha256);
                    if (callback) callback();
                };
                img.onerror = function() {
                    if (requestToken === imageLoadToken) alert('影像無法解碼，原本的影像與標註已保留。');
                };
                img.src = e.target.result;
            };
            reader.onerror = function() {
                if (requestToken === imageLoadToken) alert('影像讀取失敗，原本的影像與標註已保留。');
            };
            reader.readAsDataURL(file);
        }

        function _applySpineFMData(data) {
            const srcName = window._spinefmJsonName || 'SpineFM';

            // 透過既有的 importAnnotationJson 匯入
            data.source = 'spinefm';
            const imported = importAnnotationJson(data, { jsonFilename: srcName, silent: true });
            if (!imported) {
                window._pendingSpineFM = data;
                window._spinefmJsonName = srcName;
                return false;
            }
            window._pendingSpineFM = null;
            window._spinefmJsonName = null;

            const count = data.vertebrae ? data.vertebrae.length : 0;
            const hasFracture = (data.vertebrae || []).some(v => v.genantGrade > 0);
            let msg = `SpineFM 結果已載入: ${count} 個椎體\n`;
            if (hasFracture) {
                const fxList = data.vertebrae.filter(v => v.genantGrade > 0)
                    .map(v => `${v.name}: Grade ${v.genantGrade} (${v.genantType})`);
                msg += `\n偵測到骨折:\n${fxList.join('\n')}\n`;
            }
            msg += '\n請檢查角點位置，拖曳修正後匯出 JSON。';
            alert(msg);
            return true;
        }

        // ==================== 存回原檔（File System Access API） ====================
        // 一般檔案選擇器只能讀，存檔只能下載到 Downloads。授權 Images 資料夾（只需一次，handle 存在
        // IndexedDB，下次開啟只要再按一次允許）後，「存回原檔」直接覆蓋原本讀取的 JSON：
        //   - 從 viewer 批次模式送來：用完整相對路徑（例如 Images/202609/x.json）精準定位；
        //   - 自行匯入 JSON：在授權資料夾內依檔名搜尋，唯一才寫，同名多個就拒絕；
        //   - 目標 JSON 主檔名必須與目前影像相同；
        //   - 覆蓋前把舊內容備份到 <授權資料夾>/_json_backups/<路徑>.<時間>.bak（.bak 不會被訓練或 viewer 掃到）。
        // 注意：覆蓋會改變檔案 SHA-256，舊的 training allowlist 會判定 stale，需要重建。
        const HANDLE_DB = 'spine-annotation-tool';
        const HANDLE_STORE = 'handles';
        const HANDLE_KEY = 'imagesDir';
        const BACKUP_DIR = '_json_backups';
        let imagesDirHandle = null;
        let currentJsonSource = null;

        function idbHandle(mode, value) {
            return new Promise(resolve => {
                if (typeof indexedDB === 'undefined') return resolve(null);
                let request;
                try { request = indexedDB.open(HANDLE_DB, 1); } catch (error) { return resolve(null); }
                request.onupgradeneeded = () => request.result.createObjectStore(HANDLE_STORE);
                request.onerror = () => resolve(null);
                request.onsuccess = () => {
                    try {
                        const tx = request.result.transaction(HANDLE_STORE, mode === 'put' ? 'readwrite' : 'readonly');
                        const store = tx.objectStore(HANDLE_STORE);
                        const op = mode === 'put' ? store.put(value, HANDLE_KEY) : store.get(HANDLE_KEY);
                        op.onsuccess = () => resolve(mode === 'put' ? true : (op.result || null));
                        op.onerror = () => resolve(null);
                    } catch (error) {
                        resolve(null);
                    }
                };
            });
        }

        function updateSaveUI() {
            const info = document.getElementById('saveTargetInfo');
            if (!info) return;
            const folder = imagesDirHandle ? `已授權資料夾：${imagesDirHandle.name}` : '尚未授權 Images 資料夾';
            const target = currentJsonSource
                ? `；存回目標：${currentJsonSource.relPath || currentJsonSource.name}`
                : '；目前沒有讀取中的 JSON';
            info.textContent = folder + target;
        }

        async function restoreImagesFolder() {
            if (!imagesDirHandle) imagesDirHandle = await idbHandle('get');
            updateSaveUI();
            return imagesDirHandle;
        }

        async function grantImagesFolder() {
            if (typeof window.showDirectoryPicker !== 'function') {
                alert('此瀏覽器不支援直接寫回檔案，請改用 Chrome 或 Edge；或使用「匯出 JSON（下載）」。');
                return false;
            }
            try {
                imagesDirHandle = await window.showDirectoryPicker({ id: 'spine-images', mode: 'readwrite' });
            } catch (error) {
                if (error && error.name !== 'AbortError') alert('無法取得資料夾權限：' + error.message);
                return false;
            }
            await idbHandle('put', imagesDirHandle);
            updateSaveUI();
            return true;
        }

        async function ensureWritePermission(handle) {
            if (!handle || typeof handle.queryPermission !== 'function') return true;
            const options = { mode: 'readwrite' };
            if (await handle.queryPermission(options) === 'granted') return true;
            return (await handle.requestPermission(options)) === 'granted';
        }

        function splitRelPath(relPath, rootName) {
            const parts = String(relPath || '').replace(/\\/g, '/').split('/').filter(Boolean);
            if (parts.length > 1 && rootName && parts[0].toLowerCase() === String(rootName).toLowerCase()) parts.shift();
            return parts;
        }

        async function findJsonByName(dir, name, prefix = [], depth = 0, out = []) {
            for await (const entry of dir.values()) {
                if (entry.kind === 'file' && entry.name.toLowerCase() === String(name).toLowerCase()) {
                    out.push({ handle: entry, parts: [...prefix, entry.name] });
                } else if (entry.kind === 'directory' && entry.name !== BACKUP_DIR && depth < 4) {
                    await findJsonByName(entry, name, [...prefix, entry.name], depth + 1, out);
                }
            }
            return out;
        }

        async function resolveTargetJson(root) {
            const src = currentJsonSource;
            if (!src || !(src.name || src.relPath)) {
                return resolveNewJsonBesideImage(root);
            }
            const parts = src.relPath ? splitRelPath(src.relPath, root.name) : [];
            if (parts.length > 1) {
                try {
                    let dir = root;
                    for (const part of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(part);
                    return { handle: await dir.getFileHandle(parts[parts.length - 1]), parts };
                } catch (error) {
                    // 路徑對不上（例如授權的是上層或下層資料夾）→ 改用檔名搜尋
                }
            }
            const name = parts.length ? parts[parts.length - 1] : src.name;
            const matches = await findJsonByName(root, name);
            if (matches.length === 1) return matches[0];
            if (!matches.length) return { error: `在授權的資料夾「${root.name}」裡找不到 ${name}。` };
            return { error: `資料夾裡有 ${matches.length} 個同名的 ${name}，為避免覆蓋錯檔已取消。請從 viewer 批次模式送過來（帶完整路徑）。` };
        }

        // 尚未有 JSON 的新標註：在授權資料夾內找到目前影像（唯一），在同一層建立 <主檔名>.json
        async function resolveNewJsonBesideImage(root) {
            const imageName = currentImageMeta?.filename;
            if (!imageName) return { error: '目前影像沒有檔名，無法決定 JSON 要存在哪裡。' };
            const matches = await findJsonByName(root, imageName);
            if (!matches.length) return { error: `在授權的資料夾「${root.name}」裡找不到影像 ${imageName}。` };
            if (matches.length > 1) return { error: `資料夾裡有 ${matches.length} 個同名影像 ${imageName}，為避免存錯位置已取消。` };
            const imageParts = matches[0].parts;
            let dir = root;
            for (const part of imageParts.slice(0, -1)) dir = await dir.getDirectoryHandle(part);
            const jsonName = imageParts[imageParts.length - 1].replace(/\.[^.]+$/, '') + '.json';
            let exists = true;
            try { await dir.getFileHandle(jsonName); } catch (error) { exists = false; }
            if (exists && !confirm(`${jsonName} 已經存在，但目前沒有載入它。確定要覆蓋？（舊版會備份）`)) {
                return { error: '已取消，未覆蓋既有的 JSON。' };
            }
            return {
                handle: await dir.getFileHandle(jsonName, { create: true }),
                parts: [...imageParts.slice(0, -1), jsonName],
                created: !exists,
            };
        }

        function backupStamp(date = new Date()) {
            const pad = value => String(value).padStart(2, '0');
            return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-` +
                `${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
        }

        // 內容相同（忽略每次都會變的 exportDate）就不重寫、不產生備份
        // 內容相同（忽略每次都會變的 exportDate、reviewedAt）就不重寫、不產生備份。
        // 原檔還標著「醫師未審」（例如 AI 預標註）時一定寫入，審閱紀錄才會留下。
        function sameAnnotationContent(oldText, data) {
            try {
                const old = JSON.parse(oldText);
                if (!old.annotationReview || old.annotationReview.physicianReviewed !== true) return false;
                const strip = obj => {
                    const { exportDate: _date, annotationReview, ...rest } = obj;
                    const { reviewedAt: _at, ...review } = annotationReview || {};
                    return JSON.stringify({ ...rest, annotationReview: review });
                };
                return strip(old) === strip(data);
            } catch (error) {
                return false;
            }
        }

        // 審閱紀錄：保留原本的產生方式（例如 AI visual annotation），標註為醫師已審。
        let importedAnnotationReview = null;
        function buildAnnotationReview() {
            const prior = importedAnnotationReview || {};
            const review = {
                method: prior.method || 'physician annotation',
                physicianReviewed: true,
                reviewedAt: new Date().toISOString(),
                reviewedWith: 'spinal-annotation-web.html',
            };
            if (prior.note) review.priorNote = prior.note;
            if (prior.physicianReviewed === false) review.previouslyUnreviewed = true;
            const assisted = vertebrae.filter(v => v.assist && v.assist.method === 'MedSAM');
            if (assisted.length) {
                // 標註來源追蹤：之後評估或重訓時，可分辨哪些標準答案經過模型輔助
                review.assistedBy = {
                    method: 'MedSAM',
                    vertebrae: assisted.length,
                    editedAfterAssist: assisted.filter(v => v.assist.edited).length,
                };
            }
            return review;
        }

        async function writeText(fileHandle, text) {
            const writable = await fileHandle.createWritable();
            await writable.write(text);
            await writable.close();
        }

        function setTaskMessage(message) {
            const task = document.getElementById('taskText');
            if (task) task.textContent = message;
        }

        async function saveToOriginal() {
            const data = buildExportData();
            if (!data) return false;
            if (!imagesDirHandle) await restoreImagesFolder();
            if (!imagesDirHandle) {
                if (!confirm('尚未授權 Images 資料夾。現在選擇資料夾，以便直接存回原檔？')) return false;
                if (!(await grantImagesFolder())) return false;
            }
            if (!(await ensureWritePermission(imagesDirHandle))) {
                alert('沒有取得寫入權限，未存檔。可改用「匯出 JSON（下載）」。');
                return false;
            }
            const target = await resolveTargetJson(imagesDirHandle);
            if (target.error) {
                alert(target.error + '\n\n可改用「匯出 JSON（下載）」。');
                return false;
            }
            const targetName = target.parts[target.parts.length - 1];
            const imageStem = filenameStem(currentImageMeta?.filename);
            if (imageStem && filenameStem(targetName, true) !== imageStem) {
                alert(`存回目標 ${targetName} 與目前影像 ${currentImageMeta.filename} 的主檔名不同，為避免覆蓋錯檔已取消。`);
                return false;
            }
            const relative = target.parts.join('/');
            const newText = JSON.stringify(data, null, 2);
            const oldText = await (await target.handle.getFile()).text();
            if (target.created || !oldText) {
                await writeText(target.handle, newText);
                annotationDirty = false;
                currentJsonSource = { name: targetName, relPath: [imagesDirHandle.name, ...target.parts].join('/') };
                updateSaveUI();
                notifyViewerOfExport(data, targetName, relative);
                setTaskMessage(`已建立 ${imagesDirHandle.name}/${relative}`);
                return { path: relative, backup: null, unchanged: false, created: true };
            }
            if (sameAnnotationContent(oldText, data)) {
                annotationDirty = false;
                setTaskMessage(`${relative} 內容沒有變更，未重新寫入。`);
                return { path: relative, backup: null, unchanged: true };
            }
            const backupDir = await imagesDirHandle.getDirectoryHandle(BACKUP_DIR, { create: true });
            const backupName = `${target.parts.join('__')}.${backupStamp()}.bak`;
            await writeText(await backupDir.getFileHandle(backupName, { create: true }), oldText);
            await writeText(target.handle, newText);
            annotationDirty = false;
            notifyViewerOfExport(data, targetName, relative);
            setTaskMessage(`已存回 ${imagesDirHandle.name}/${relative}（舊版備份：${BACKUP_DIR}/${backupName}）`);
            return { path: relative, backup: `${BACKUP_DIR}/${backupName}`, unchanged: false };
        }

        // ==================== 與 annotation-viewer.html 連線 ====================
        // viewer 以 ?import=viewer 開啟本頁並以 postMessage 傳入 {type: 'spine-viewer-case', imageFile, jsonText, ...}；
        // 本頁匯出 JSON 時回傳 {type: 'spine-editor-exported', jsonText, filename, sourceImagePath} 讓 viewer 即時重畫。
        let viewerLink = null;

        function initViewerBridge() {
            window.addEventListener('message', handleViewerMessage);
            const params = new URLSearchParams(window.location.search);
            if (params.get('import') === 'viewer' && window.opener) {
                window.opener.postMessage({ type: 'spine-editor-ready' }, '*');
            }
        }

        function decodeImageBlob(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(reader.error || new Error('影像讀取失敗'));
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => reject(new Error('影像解碼失敗'));
                    img.src = event.target.result;
                };
                reader.readAsDataURL(blob);
            });
        }

        async function handleViewerMessage(event) {
            const data = event && event.data;
            if (!data || data.type !== 'spine-viewer-case') return false;
            if (window.opener && event.source && event.source !== window.opener) return false;
            const imageFile = data.imageFile;
            if (!imageFile || typeof imageFile.arrayBuffer !== 'function') return false;
            if (!confirmDiscardUnsavedChanges()) return false;

            const requestToken = ++imageLoadToken;
            let img;
            try {
                img = await decodeImageBlob(imageFile);
            } catch (error) {
                alert(`無法載入 viewer 傳來的影像：${error.message}`);
                return false;
            }
            const [sha256, pixelSha256] = await Promise.all([calculateFileSha256(imageFile), calculatePixelSha256(imageFile, img)]);
            if (requestToken !== imageLoadToken) return false;
            const fileMeta = {
                name: imageFile.name || data.imageName || null,
                size: imageFile.size,
                lastModified: imageFile.lastModified,
            };
            commitLoadedImage(img, fileMeta, sha256, pixelSha256);
            viewerLink = {
                source: event.source || window.opener || null,
                sourceImagePath: data.sourceImagePath || fileMeta.name,
                sourceJsonPath: data.sourceJsonPath || null,
            };

            let imported = true;
            if (data.jsonText) {
                try {
                    imported = importAnnotationJson(JSON.parse(data.jsonText), {
                        jsonFilename: data.jsonName || null,
                        replaceConfirmed: true,
                        silent: true,
                    });
                } catch (error) {
                    alert(`viewer 傳來的 JSON 無法解析：${error.message}`);
                    imported = false;
                }
            }
            if (imported && data.jsonText) {
                currentJsonSource = { name: data.jsonName || null, relPath: data.sourceJsonPath || null };
                updateSaveUI();
            }
            const task = document.getElementById('taskText');
            if (task) {
                task.textContent = imported
                    ? `已從 viewer 載入 ${viewerLink.sourceImagePath}，修正後按「匯出 JSON」會同步回 viewer。`
                    : `已從 viewer 載入影像 ${viewerLink.sourceImagePath}，但標註未載入（見提示）。`;
            }
            document.title = `修正：${viewerLink.sourceImagePath}`;
            return imported;
        }

        function notifyViewerOfExport(data, filename, savedPath = null) {
            if (!viewerLink || !viewerLink.source || viewerLink.source.closed) return false;
            if (typeof viewerLink.source.postMessage !== 'function') return false;
            viewerLink.source.postMessage({
                type: 'spine-editor-exported',
                jsonText: JSON.stringify(data, null, 2),
                filename,
                savedToOriginal: !!savedPath,
                savedPath,
                sourceImagePath: viewerLink.sourceImagePath,
                sourceJsonPath: viewerLink.sourceJsonPath,
            }, '*');
            return true;
        }

        // 自動從 sessionStorage 載入推理結果 (從 inference web 跳轉)
        function checkAutoImport() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('import') === 'inference') {
                try {
                    const stored = sessionStorage.getItem('inferenceResult');
                    if (stored) {
                        sessionStorage.removeItem('inferenceResult');
                        const data = JSON.parse(stored);
                        importAnnotationJson(data);
                    }
                } catch(e) {
                    console.error('Auto-import failed:', e);
                }
            }
        }

        // ==================== 繪製 ====================
        function redraw() {
            if (!originalImage) {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('請載入或貼上脊椎 X 光影像', canvas.width/2, canvas.height/2);
                return;
            }

            ctx.save();
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);

            const img = (contrastEnhanced && processedImage) ? processedImage : originalImage;
            ctx.drawImage(img, 0, 0);

            // 繪製已完成的椎體
            vertebrae.forEach((v, idx) => {
                const isSelected = selectedVertebrae.has(idx);
                const isAbnormal = !v.boundaryType && (checkVertebraAbnormal(v) || checkBiconcaveCompression(v));
                const color = isSelected ? '#ff2222' :
                              v.boundaryType ? COLORS.boundaryVertebra :
                              isAbnormal ? COLORS.abnormalVertebra : COLORS.completedVertebra;
                drawVertebra(v, color, idx);
                // 選取高亮: 粗外框
                if (isSelected) {
                    const pts = v.points;
                    ctx.strokeStyle = '#ff2222';
                    ctx.lineWidth = 4 / zoom;
                    ctx.setLineDash([6 / zoom, 4 / zoom]);
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            });

            // 繪製當前點
            const nextName = getNextVertebraName();
            const labels = nextName ? getPointLabelsForVertebra(nextName) : [];
            currentPoints.forEach((p, idx) => {
                const colors = [COLORS.point1, COLORS.point2, COLORS.point3, COLORS.point4, COLORS.point5, COLORS.point6];
                drawPoint(p, colors[idx], idx + 1);
                if (idx > 0) drawLine(currentPoints[idx-1], p, '#ffffff', 2);
            });

            // 預覽閉合線
            const reqPts = nextName ? getRequiredPoints(nextName) : endplatePointMode * 2;
            if (currentPoints.length === reqPts - 1 && reqPts === endplatePointMode * 2) {
                ctx.setLineDash([5, 5]);
                drawLine(currentPoints[currentPoints.length - 1], currentPoints[0], '#ffffff', 1);
                ctx.setLineDash([]);
            }

            // 框選矩形
            if (selectBox) {
                const x = Math.min(selectBox.startX, selectBox.endX);
                const y = Math.min(selectBox.startY, selectBox.endY);
                const w = Math.abs(selectBox.endX - selectBox.startX);
                const h = Math.abs(selectBox.endY - selectBox.startY);
                ctx.fillStyle = 'rgba(255, 50, 50, 0.12)';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 2 / zoom;
                ctx.setLineDash([6 / zoom, 4 / zoom]);
                ctx.strokeRect(x, y, w, h);
                ctx.setLineDash([]);
            }

            // MedSAM 拉框
            if (medsamBox) {
                const x = Math.min(medsamBox.startX, medsamBox.endX);
                const y = Math.min(medsamBox.startY, medsamBox.endY);
                const w = Math.abs(medsamBox.endX - medsamBox.startX);
                const h = Math.abs(medsamBox.endY - medsamBox.startY);
                ctx.fillStyle = 'rgba(0, 220, 220, 0.10)';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#00e5e5';
                ctx.lineWidth = 2 / zoom;
                ctx.setLineDash([6 / zoom, 4 / zoom]);
                ctx.strokeRect(x, y, w, h);
                ctx.setLineDash([]);
            }

            ctx.restore();
        }

        function drawVertebra(v, color, index) {
            const pts = v.points;

            if (v.boundaryType) {
                // 邊界椎體：畫 3 點終板折線（anterior → middle → posterior）
                ctx.strokeStyle = color;
                ctx.lineWidth = 3 / zoom;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.stroke();

                // 標記端點
                drawPoint(pts[0], COLORS.point1, null, 5 / zoom); // 前
                drawPoint(pts[1], COLORS.point2, null, 5 / zoom); // 中
                drawPoint(pts[2], COLORS.point3, null, 5 / zoom); // 後

                // 標籤
                const cx = pts[1].x;
                const cy = pts[1].y;
                const offset = v.boundaryType === 'upper' ? -20 : 20;
                drawLabel(v.name, cx, cy + offset / zoom);
            } else {
                // 完整椎體 4/6 點: [0:AS, 1:MS, 2:PS, 3:PI, 4:MI, 5:AI]
                // 繪製填充多邊形
                ctx.fillStyle = color + '30';
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.lineTo(pts[4].x, pts[4].y);
                ctx.lineTo(pts[5].x, pts[5].y);
                ctx.closePath();
                ctx.fill();

                // 繪製輪廓
                ctx.strokeStyle = color;
                ctx.lineWidth = 2 / zoom;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.lineTo(pts[4].x, pts[4].y);
                ctx.lineTo(pts[5].x, pts[5].y);
                ctx.closePath();
                ctx.stroke();

                // 上終板（紅色折線）: AS → MS → PS
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 3 / zoom;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.stroke();

                // 下終板（藍色折線）: AI → MI → PI
                ctx.strokeStyle = '#339af0';
                ctx.beginPath();
                ctx.moveTo(pts[5].x, pts[5].y);
                ctx.lineTo(pts[4].x, pts[4].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.stroke();

                // 前緣: AS → AI
                ctx.strokeStyle = '#ff6b6b80';
                ctx.lineWidth = 2 / zoom;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[5].x, pts[5].y);
                ctx.stroke();

                // 後緣: PS → PI
                ctx.strokeStyle = '#339af080';
                ctx.beginPath();
                ctx.moveTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.stroke();

                // 繪製各角點
                const colors = [COLORS.point1, COLORS.point2, COLORS.point3, COLORS.point4, COLORS.point5, COLORS.point6];
                pts.forEach((p, i) => {
                    drawPoint(p, colors[i], null, 4 / zoom);
                });

                // 標籤放在椎體中心
                const centerX = (pts[0].x + pts[3].x) / 2;
                const centerY = (pts[0].y + pts[3].y) / 2;
                drawLabel(v.name, centerX, centerY);
            }
        }

        function drawLabel(text, x, y) {
            const fontSize = Math.max(12, 16 / zoom);
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const textWidth = ctx.measureText(text).width;
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(x - textWidth/2 - 4, y - fontSize/2 - 2, textWidth + 8, fontSize + 4);
            ctx.fillStyle = '#fff';
            ctx.fillText(text, x, y);
        }

        function drawPoint(p, color, label, radius = 6) {
            const r = (typeof radius === 'number' ? radius : 6) / (radius > 1 ? 1 : zoom);
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5 / zoom;
            ctx.stroke();

            if (label) {
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${10/zoom}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label.toString(), p.x, p.y);
            }
        }

        function drawLine(p1, p2, color, width) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width / zoom;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        // ==================== 分析計算 ====================
        function checkVertebraAbnormal(v) {
            // Genant semi-quantitative: threshold 0.8
            if (!v.anteriorHeight || !v.posteriorHeight) return false;
            if (v.anteriorHeight < v.posteriorHeight * 0.8) return 'anteriorWedging';
            if (v.posteriorHeight < v.anteriorHeight * 0.8) return 'crushDeformity';
            return false;
        }

        function checkBiconcaveCompression(v) {
            // Genant: middleHeight / posteriorHeight < 0.8
            if (!v.hasMiddlePoints) return false;
            if (!v.middleHeight || !v.posteriorHeight) return false;
            return v.middleHeight < v.posteriorHeight * 0.8;
        }

        function getAnatomicalOrder() {
            // 將椎體按解剖學由上到下排列
            const config = CONFIG[spineType];
            const order = config.vertebrae;
            return [...vertebrae].sort((a, b) => order.indexOf(a.name) - order.indexOf(b.name));
        }

        function getDiscLevel(upperName, lowerName) {
            // 永遠按解剖學順序命名：上椎體/下椎體
            const config = CONFIG[spineType];
            const order = config.vertebrae;
            const iUpper = order.indexOf(upperName);
            const iLower = order.indexOf(lowerName);
            if (iUpper < iLower) return `${upperName}/${lowerName}`;
            return `${lowerName}/${upperName}`;
        }

        function calculateDiscMetrics(upperV, lowerV) {
            // 上椎體的下終板 vs 下椎體的上終板
            const upperLower = getLowerEndplate(upperV); // [anterior, middle, posterior]
            const lowerUpper = getUpperEndplate(lowerV); // [anterior, middle, posterior]

            if (!upperLower || !lowerUpper) return null;

            const anteriorHeight = Math.sqrt(
                Math.pow(lowerUpper[0].x - upperLower[0].x, 2) +
                Math.pow(lowerUpper[0].y - upperLower[0].y, 2)
            );

            const posteriorHeight = Math.sqrt(
                Math.pow(lowerUpper[2].x - upperLower[2].x, 2) +
                Math.pow(lowerUpper[2].y - upperLower[2].y, 2)
            );

            // 使用實際中點距離，而非平均值，避免凹陷終板造成重複
            const middleHeight = Math.sqrt(
                Math.pow(lowerUpper[1].x - upperLower[1].x, 2) +
                Math.pow(lowerUpper[1].y - upperLower[1].y, 2)
            );

            const upperAngle = Math.atan2(
                upperLower[2].y - upperLower[0].y,
                upperLower[2].x - upperLower[0].x
            );
            const lowerAngle = Math.atan2(
                lowerUpper[2].y - lowerUpper[0].y,
                lowerUpper[2].x - lowerUpper[0].x
            );
            let wedgeAngle = Math.abs(upperAngle - lowerAngle) * 180 / Math.PI;
            if (wedgeAngle > 90) wedgeAngle = 180 - wedgeAngle;

            const overlap = checkDiscOverlap(upperLower, lowerUpper);

            return { anteriorHeight, posteriorHeight, middleHeight, wedgeAngle, overlap };
        }

        function checkDiscOverlap(upperLower, lowerUpper) {
            const comparisons = upperLower.map((point, i) => ({
                upper: point,
                lower: lowerUpper[i]
            }));
            return comparisons.some(pair => pair.lower.y < pair.upper.y - 1);
        }

        function checkListhesis() {
            // 滑脫偵測: 比較相鄰椎體後緣 X 座標的位移
            // 用相鄰兩椎體的後緣下角 vs 後緣上角的 X 差，
            // 而非全域首尾連線（lordotic curve 會造成誤判）
            const results = [];
            const ordered = getAnatomicalOrder();

            for (let i = 0; i < ordered.length - 1; i++) {
                const upper = ordered[i];
                const lower = ordered[i + 1];

                // 取上椎體的後緣下角 (posteriorInferior)
                const upperPost = getPosteriorPoints(upper);
                // 取下椎體的後緣上角 (posteriorSuperior)
                const lowerPost = getPosteriorPoints(lower);

                if (!upperPost.bottom || !lowerPost.top) continue;

                const xShift = upperPost.bottom.x - lowerPost.top.x;

                // 用下椎體的整體寬度作為參考 (anterior 到 posterior 最大 X 跨度)
                const lowerPts = lower.points;
                const allX = lowerPts.map(p => p.x);
                const width = Math.max(...allX) - Math.min(...allX);
                if (width === 0) continue;

                const shiftPercent = Math.abs(xShift) / width * 100;

                // 門檻: > 10% 才報告 (5% 在正常 lordosis 下常見)
                if (shiftPercent > 10) {
                    // lateral X-ray: posterior = 較大 X (右側)
                    // xShift > 0: 上椎體後緣 X 較大 = 上椎體向後滑 → retrolisthesis
                    // xShift < 0: 上椎體後緣 X 較小 = 上椎體向前滑 → anterolisthesis
                    const type = xShift > 0 ? 'Retrolisthesis' : 'Anterolisthesis';

                    results.push({
                        level: `${upper.name} on ${lower.name}`,
                        type: type,
                        shift: shiftPercent.toFixed(1)
                    });
                }
            }
            return results;
        }

        function checkHeightProgression() {
            const results = [];
            const ordered = getAnatomicalOrder();
            const discHeights = [];

            for (let i = 0; i < ordered.length - 1; i++) {
                const metrics = calculateDiscMetrics(ordered[i], ordered[i + 1]);
                if (!metrics) continue;
                const level = getDiscLevel(ordered[i].name, ordered[i + 1].name);
                discHeights.push({ level, height: metrics.middleHeight });
            }

            if (discHeights.length < 3) return results;

            const config = CONFIG[spineType];
            // 已報過的 level 不重複
            const flagged = new Set();

            if (config.expectedHeightPattern === 'L4L5_highest') {
                // 策略: 找高度明顯偏低的椎間盤
                // 比較每個椎間盤與相鄰椎間盤的高度
                for (let i = 0; i < discHeights.length; i++) {
                    const d = discHeights[i];
                    if (d.level === 'L5/S1') continue; // L5/S1 本來就較窄

                    // 取相鄰椎間盤高度
                    const neighbors = [];
                    if (i > 0) neighbors.push(discHeights[i - 1].height);
                    if (i < discHeights.length - 1 && discHeights[i + 1].level !== 'L5/S1') {
                        neighbors.push(discHeights[i + 1].height);
                    }
                    if (neighbors.length === 0) continue;

                    const avgNeighbor = neighbors.reduce((a, b) => a + b, 0) / neighbors.length;

                    // 高度低於相鄰平均的 60% → 明顯狹窄
                    if (d.height < avgNeighbor * 0.6) {
                        results.push({
                            level: d.level,
                            issue: `椎間盤高度明顯偏低`,
                            severity: 'warning'
                        });
                        flagged.add(d.level);
                    }
                }
            } else if (config.expectedHeightPattern === 'increasing') {
                for (let i = 0; i < discHeights.length - 1; i++) {
                    if (discHeights[i].height > discHeights[i + 1].height * 1.2) {
                        results.push({
                            level: discHeights[i].level,
                            issue: `椎間盤高度遞進異常（應越來越高）`,
                            severity: 'warning'
                        });
                    }
                }
            }
            return results;
        }

        // ==================== UI 更新 ====================
        function updateUI() {
            const config = CONFIG[spineType];
            const total = config.vertebrae.length;
            const completed = vertebrae.length;

            document.getElementById('progressCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressFill').style.width = `${(completed / total) * 100}%`;

            // 顯示/隱藏「結束標註」按鈕：至少 2 個椎體且尚未結束
            const btnFinish = document.getElementById('btnFinishEarly');
            if (btnFinish) {
                btnFinish.style.display = (completed >= 2 && !annotationFinished && completed < total) ? '' : 'none';
            }

            // 顯示/隱藏「刪除選取」按鈕
            const btnDelSel = document.getElementById('btnDeleteSelected');
            if (btnDelSel) {
                btnDelSel.style.display = selectedVertebrae.size > 0 ? '' : 'none';
                document.getElementById('selectedCount').textContent = selectedVertebrae.size;
            }

            updateCurrentTask();
            updateVertebraList();
            updateDiscAnalysis();
            updateAbnormalities();
        }

        function updateCurrentTask() {
            const taskText = document.getElementById('taskText');
            const pointGuide = document.getElementById('pointGuide');

            if (!originalImage) {
                taskText.textContent = '請先載入或貼上影像';
                pointGuide.style.display = 'none';
                return;
            }

            const nextName = getNextVertebraName();
            if (!nextName) {
                taskText.textContent = '✅ 標註完成！可以匯出數據';
                pointGuide.style.display = 'none';
                return;
            }

            const required = getRequiredPoints(nextName);
            const labels = getPointLabelsForVertebra(nextName);
            const bType = isBoundary(nextName);
            const bHint = bType === 'upper' ? '(上終板)' :
                          bType === 'lower' ? '(下終板)' : '';

            taskText.textContent = `標註 ${nextName} ${bHint} (${currentPoints.length}/${required} 點)`;
            pointGuide.style.display = 'grid';
            pointGuide.style.gridTemplateColumns = `repeat(${Math.min(labels.length, 3)}, 1fr)`;

            // 更新點引導 — 動態顯示
            const guideContainer = document.getElementById('pointGuide');
            let guideHtml = '';
            labels.forEach((label, i) => {
                const isActive = i === currentPoints.length;
                const colorClasses = ['point-1', 'point-2', 'point-3', 'point-4', 'point-5', 'point-6'];
                guideHtml += `<div class="point-item ${colorClasses[i]} ${isActive ? 'active' : ''}">
                    ${i + 1} ${label}
                </div>`;
            });
            guideContainer.innerHTML = guideHtml;
        }

        function updateVertebraList() {
            const list = document.getElementById('vertebraList');
            const config = CONFIG[spineType];

            if (vertebrae.length === 0) {
                list.innerHTML = '<div style="color: #999; font-size: 12px; padding: 10px;">尚未標註椎體</div>';
                return;
            }

            let html = '';
            vertebrae.forEach((v, idx) => {
                const abnormalType = !v.boundaryType && checkVertebraAbnormal(v);
                const biconcave = !v.boundaryType && checkBiconcaveCompression(v);
                const isBound = !!v.boundaryType;
                const statusClass = (abnormalType || biconcave) ? 'warning' : 'complete';
                const abnormalLabel = abnormalType === 'anteriorWedging' ? '⚠️ 前緣壓迫' :
                                     abnormalType === 'crushDeformity' ? '⚠️ Crush' : '';
                const statusText = isBound ? (v.boundaryType === 'upper' ? '上終板' : '下終板') :
                                   abnormalType ? abnormalLabel :
                                   biconcave ? '⚠️ 雙凹壓迫' : '✓ 完成';

                // 選單包含所有椎體名稱
                const allNames = config.vertebrae;

                const isSelected = selectedVertebrae.has(idx);

                html += `
                    <div class="vertebra-card" style="${isSelected ? 'border: 2px solid #ff3333; background: #fff5f5;' : ''}">
                        <div class="vertebra-header" onclick="toggleVertebraBody(${idx})">
                            <input type="checkbox" ${isSelected ? 'checked' : ''}
                                onclick="event.stopPropagation(); toggleSelectVertebra(${idx})"
                                title="選取此椎體 (可框選或 Delete 刪除)"
                                style="margin-right: 6px; cursor: pointer;">
                            <div class="vertebra-name">
                                <select onchange="changeVertebraName(${idx}, this.value)" onclick="event.stopPropagation()">
                                    ${allNames.map(name =>
                                        `<option value="${name}" ${v.name === name ? 'selected' : ''}>${name}</option>`
                                    ).join('')}
                                </select>
                            </div>
                            <span class="vertebra-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="vertebra-body" id="vertebra-body-${idx}">`;

                if (!isBound) {
                    html += `
                            <div class="metric-row">
                                <span class="metric-label">前緣高度:</span>
                                <span class="metric-value">${v.anteriorHeight?.toFixed(1) || '-'} px</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">中間高度:</span>
                                <span class="metric-value">${v.middleHeight?.toFixed(1) || '-'} px</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">後緣高度:</span>
                                <span class="metric-value">${v.posteriorHeight?.toFixed(1) || '-'} px</span>
                            </div>
                            <div class="metric-row">
                                <span class="metric-label">前/後比例:</span>
                                <span class="metric-value ${abnormalType ? 'danger' : ''}">${v.anteriorHeight && v.posteriorHeight ? (v.anteriorHeight / v.posteriorHeight * 100).toFixed(0) + '%' : '-'}</span>
                            </div>
                            ${abnormalType === 'anteriorWedging' ? '<div style="color: #dc3545; font-size: 11px; margin-top: 5px;">⚠️ 疑似前緣壓迫性骨折 (Anterior Wedging)</div>' : ''}
                            ${abnormalType === 'crushDeformity' ? '<div style="color: #dc3545; font-size: 11px; margin-top: 5px;">⚠️ 疑似 Crush Deformity Compression Fracture</div>' : ''}`;
                    if (biconcave) {
                        html += '<div style="color: #dc3545; font-size: 11px; margin-top: 5px;">⚠️ 疑似雙凹壓迫性骨折 (Biconcave)</div>';
                    }
                    if (!v.hasMiddlePoints) {
                        html += '<div style="color: #6c757d; font-size: 11px; margin-top: 5px;">中點高度為推估值（未標註中點）</div>';
                    }
                } else {
                    html += `<div style="color: #6c757d; font-size: 11px;">邊界椎體 — 僅標記${v.boundaryType === 'upper' ? '上' : '下'}終板</div>`;
                }

                html += `</div></div>`;
            });

            list.innerHTML = html;
        }

        function toggleVertebraBody(idx) {
            document.getElementById(`vertebra-body-${idx}`).classList.toggle('show');
        }

        function changeVertebraName(idx, newName) {
            const oldBoundary = isBoundary(vertebrae[idx].name);
            const newBoundary = isBoundary(newName);

            // 如果邊界類型改變（點數不同），提醒使用者
            if (oldBoundary !== newBoundary) {
                const fullPoints = endplatePointMode * 2;
                const boundaryPoints = endplatePointMode;
                alert(`注意：${newName} ${newBoundary ? '是邊界椎體（' + (newBoundary === 'upper' ? '上終板' : '下終板') + '）' : '是完整椎體（' + fullPoints + '點）'}。\n點數不匹配（邊界需 ${boundaryPoints} 點），建議刪除後重新標註。`);
            }

            vertebrae[idx].name = newName;
            vertebrae[idx].boundaryType = newBoundary;
            markAnnotationDirty();
            updateUI();
            redraw();
        }

        function updateDiscAnalysis() {
            const container = document.getElementById('discAnalysis');
            const ordered = getAnatomicalOrder();

            if (ordered.length < 2) {
                container.innerHTML = '<div style="color: #999; font-size: 12px; padding: 10px;">需要至少 2 個椎體才能分析椎間盤</div>';
                return;
            }

            let html = '';
            for (let i = 0; i < ordered.length - 1; i++) {
                const metrics = calculateDiscMetrics(ordered[i], ordered[i + 1]);
                if (!metrics) continue;

                const level = getDiscLevel(ordered[i].name, ordered[i + 1].name);
                const isNarrow = metrics.middleHeight < 20;
                const isOverlap = metrics.overlap;
                const isAbnormal = isNarrow || isOverlap;

                html += `
                    <div class="disc-card ${isAbnormal ? 'abnormal' : ''}">
                        <div class="disc-header">💿 ${level}</div>
                        <div class="disc-metrics">
                            <div class="disc-metric">前方: ${metrics.anteriorHeight.toFixed(1)} px</div>
                            <div class="disc-metric">後方: ${metrics.posteriorHeight.toFixed(1)} px</div>
                            <div class="disc-metric">平均: ${metrics.middleHeight.toFixed(1)} px</div>
                            <div class="disc-metric">Wedge: ${metrics.wedgeAngle.toFixed(1)}°</div>
                            ${isOverlap ? '<div class="disc-metric">⚠️ 終板重疊 (Disc narrowing)</div>' : ''}
                        </div>
                    </div>`;
            }

            container.innerHTML = html || '<div style="color: #999; font-size: 12px; padding: 10px;">無法計算椎間盤（缺少相鄰終板）</div>';
        }

        function updateAbnormalities() {
            const container = document.getElementById('abnormalities');
            const abnormalities = [];

            // 1. 壓迫性骨折
            vertebrae.forEach(v => {
                const abnType = !v.boundaryType && checkVertebraAbnormal(v);
                const biconcave = !v.boundaryType && checkBiconcaveCompression(v);
                if (abnType === 'anteriorWedging') {
                    abnormalities.push({
                        type: 'danger',
                        title: `${v.name} Anterior Wedging Fracture`,
                        detail: `Ant/Post: ${(v.anteriorHeight / v.posteriorHeight * 100).toFixed(0)}% (< 80%)`
